<!doctype html><meta charset="utf-8"><title>Week4 frozen camera path</title>
<style>body{font-family:system-ui;max-width:900px;margin:32px auto;line-height:1.6}
img{width:576px;image-rendering:pixelated}button,input{margin:8px}</style>
<h1>Frozen model: local camera path A → B → A</h1>
<p>This is a local translation path, not a 360-degree reconstruction or temporal world model.
Interpolated frames have no held-out RGB ground truth. No optimizer or topology edits run.</p>
<button id="play">Play / Pause</button><input type="range" id="slider" min="0" value="0"><span id="label"></span>
<p><img id="frame" alt="Camera-path frame"></p><p><a href="camera_path.avi" download>Uncompressed AVI</a>
 | <a href="render_report.json">Render checks and timings</a></p>
